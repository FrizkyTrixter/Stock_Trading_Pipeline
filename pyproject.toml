[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-trading-system"
version = "0.1.0"
description = "Auditable Yahoo Finance research and simulated-trading system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.0,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
  "uvicorn>=0.29,<1",
  "xgboost>=2.0,<4",
]

[project.optional-dependencies]
market-data = ["pyarrow>=15,<22", "yfinance>=0.2.40,<1"]
research = ["openai>=1.0,<3"]
dev = ["mypy>=1.10,<2", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "types-PyYAML>=6,<7"]

[project.scripts]
trading-system = "trading_system.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --basetemp=.pytest-tmp --cov=trading_system --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607", "S608"]
"src/agents/**" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["trading_system"]
ignore_missing_imports = true
