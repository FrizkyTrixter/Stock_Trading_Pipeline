name: Daily Market Cycle

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # 23:15 UTC is after the US close in both EST and EDT; the CLI verifies a new session.
    - cron: "15 23 * * 1-5"

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-market-cycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ERP_ENDPOINT: ${{ secrets.ERP_ENDPOINT }}
      ERP_HMAC_SECRET: ${{ secrets.ERP_HMAC_SECRET }}
      MODEL_VERSION: ${{ vars.MODEL_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[market-data]"
      - name: Restore latest durable strategy state
        shell: bash
        run: |
          mkdir -p /tmp/strategy-state data
          run_id=$(gh run list --workflow daily-market-cycle.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            run_id=$(gh run list --workflow monthly-research.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          test -n "$run_id" || { echo "No monthly research state artifact exists"; exit 1; }
          gh run download "$run_id" --name strategy-state --dir /tmp/strategy-state 2>/dev/null || \
            gh run download "$run_id" --name monthly-strategy-state --dir /tmp/strategy-state
          state_db=$(find /tmp/strategy-state -name trading_system.db -print -quit)
          test -n "$state_db" || { echo "Downloaded artifact has no strategy database"; exit 1; }
          cp "$state_db" data/trading_system.db
      - name: Run the complete idempotent EOD cycle
        run: trading-system run-eod --model data/processed/xgboost_model_market_data_20260705_212648.joblib
      - uses: actions/upload-artifact@v4
        with:
          name: strategy-state
          path: |
            data/trading_system.db
            artifacts/runs/**
            artifacts/erp-outbox/**
            artifacts/erp-dead-letter/**
          retention-days: 95
          if-no-files-found: error
