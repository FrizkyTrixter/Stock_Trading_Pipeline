name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1-5"

permissions:
  contents: read

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pyarrow requests

      - name: Create folders
        run: |
          mkdir -p data/raw data/processed data/predictions

      - name: Download market data
        run: |
          python src/data/download_market_data.py --universe src/agents/ticker_universe.json --output data/raw/market_data.parquet

      - name: Upload generated market data
        uses: actions/upload-artifact@v4
        with:
          name: market-data
          path: data/raw/market_data.parquet
          retention-days: 7
