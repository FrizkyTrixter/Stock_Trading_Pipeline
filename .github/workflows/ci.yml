name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,market-data]"
      - name: Format
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/trading_system
      - name: Test without external services
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src

