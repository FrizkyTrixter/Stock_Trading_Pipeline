name: Monthly AI Research

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force replacement of the current month's universe
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 3 2 * *"

permissions:
  contents: read

concurrency:
  group: monthly-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ERP_ENDPOINT: ${{ secrets.ERP_ENDPOINT }}
      ERP_HMAC_SECRET: ${{ secrets.ERP_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[market-data,research]"
      - name: Generate or reuse monthly universe
        run: >-
          trading-system research-universe
          ${{ inputs.force && '--force' || '' }}
      - name: Prime Yahoo market history
        run: trading-system update-market-data
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-strategy-state
          path: |
            data/trading_system.db
            data/cache/yahoo/daily_ohlcv.parquet
          retention-days: 95
          if-no-files-found: error

